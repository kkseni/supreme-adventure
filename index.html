<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/supreme-adventure/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <script type="module" crossorigin src="/supreme-adventure/index.js"></script>
    <link rel="stylesheet" crossorigin href="/supreme-adventure/assets/styles-DJBWpd7V.css">
  </head>
  <body>
    <!-- #region header -->
<header class="header">
  <div class="container header-container">
      <nav class="navigation">
          <a href="./index.html" class="header-logo"><img src="/supreme-adventure/assets/logo-CWKflIk4.svg" alt="logo" />
              Product</a>
          <ul class="list-navigation">
              <li class="list-navigation-item">
                  <a href="./index.html" class="list-navigation-link current">Product</a>
              </li>
              <li class="list-navigation-item">
                  <a href="./pricing.html" class="list-navigation-link">Pricing</a>
              </li>
              <li class="list-navigation-item">
                  <a href="./customer.html" class="list-navigation-link">Customers</a>
              </li>
              <li class="list-navigation-item">
                  <a href="./resources.html" class="list-navigation-link">Resources</a>
              </li>
          </ul>
      </nav>
      <ul class="header-list-buttons">
          <li class="header-list-btn-item">
              <button type="button" class="header-list-btn sign-in">
                  Sign In
              </button>
          </li>
          <li class="header-list-btn-item">
              <button type="button" class="header-list-btn sign-up">
                  Sign Up
              </button>
          </li>
      </ul>
  </div>
</header>
<!-- #endregion header -->

    <main>
      <!-- Loads the specified .html file -->
      <section class="vite-promo">
  <div class="container">
    <div class="vite-promo-thumb">
      <a
        class="vite-promo-link"
        href="https://vitejs.dev/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Link to Vite official website"
        title="Vite.js  build tool"
      >
        <!-- Path to images as from index.html file -->
        <img
          class="pic"
          src="/supreme-adventure/assets/vite-logo-9o_aqrTe.png"
          alt="Vite logo"
          width="640"
          height="640"
        />
      </a>
    </div>
    <h1 class="main-title">
      <span class="main-title-gradient">Vite</span>
      Template by
      <a
        class="main-title-link"
        href="https://github.com/goitacademy/vanilla-app-template"
        target="_blank"
        rel="noopener noreferrer"
      >
        GoIT
      </a>
    </h1>
  </div>
</section>

      <article class="badges">
  <div class="container">
    <ul class="badges-list">
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/vite-plugin-html-inject"
          target="_blank"
          rel="noopener noreferrer"
        >
          HTML Inject
        </a>
      </li>
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/vite-plugin-full-reload"
          target="_blank"
          rel="noopener noreferrer"
        >
          Full Reload
        </a>
      </li>
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/postcss-sort-media-queries"
          target="_blank"
          rel="noopener noreferrer"
        >
          Sort Media Queries
        </a>
      </li>
    </ul>
  </div>
</article>

    </main>

    <footer class="footer">
  <div class="container">
    <p class="footer-desc">
      Made with ✨ by
      <a
        class="footer-link"
        href="https://goit.global/ua/"
        target="_blank"
        rel="noopener noreferrer"
      >
        GoIT team
      </a>
    </p>
  </div>
</footer>


  </body>
</html>
